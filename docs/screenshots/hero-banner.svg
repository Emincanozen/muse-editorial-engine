<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0d111d"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c94f3c"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGradient)"/>
  <rect width="1200" height="340" rx="16" stroke="#1e293b" stroke-width="2"/>

  <!-- Ambient glow circles -->
  <circle cx="200" cy="80" r="120" fill="#c94f3c" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1020" cy="240" r="130" fill="#6366f1" opacity="0.14" filter="url(#glow)"/>

  <!-- Top badge -->
  <rect x="60" y="44" width="210" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="76" cy="58" r="4" fill="#c94f3c"/>
  <text x="88" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#fca5a5" letter-spacing="0.08em">EDITORIAL CAROUSEL ENGINE</text>

  <!-- Project Title -->
  <text x="60" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">
    Muse Editorial Engine
  </text>

  <!-- Subtitle Tagline -->
  <text x="60" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
    Autonomous AI Copywriting Engine &amp; Editorial Carousel Studio
  </text>

  <!-- Divider Line -->
  <rect x="60" y="210" width="1080" height="1" fill="#1e293b"/>

  <!-- Tech Pills Row -->
  <!-- Pill 1 -->
  <g transform="translate(60, 236)">
    <rect width="210" height="42" rx="8" fill="url(#pillGrad)" stroke="#334155" stroke-width="1"/>
    <circle cx="22" cy="21" r="5" fill="#38bdf8"/>
    <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Next.js 16 · React 19</text>
  </g>

  <!-- Pill 2 -->
  <g transform="translate(290, 236)">
    <rect width="250" height="42" rx="8" fill="url(#pillGrad)" stroke="#334155" stroke-width="1"/>
    <circle cx="22" cy="21" r="5" fill="#f59e0b"/>
    <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Multi-Framework Copy</text>
  </g>

  <!-- Pill 3 -->
  <g transform="translate(560, 236)">
    <rect width="270" height="42" rx="8" fill="url(#pillGrad)" stroke="#334155" stroke-width="1"/>
    <circle cx="22" cy="21" r="5" fill="#c94f3c"/>
    <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Headless Puppeteer Render</text>
  </g>

  <!-- Pill 4 -->
  <g transform="translate(850, 236)">
    <rect width="250" height="42" rx="8" fill="url(#pillGrad)" stroke="#334155" stroke-width="1"/>
    <circle cx="22" cy="21" r="5" fill="#10b981"/>
    <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Magazine Carousel Studio</text>
  </g>

  <!-- Accent bar at bottom -->
  <rect x="0" y="334" width="1200" height="6" rx="3" fill="url(#accentGrad)"/>
</svg>
